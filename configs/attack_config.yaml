# CKKS-Fed 鲁棒性攻击实验配置文件
# 联邦学习 + CKKS同态加密 + 攻击与防御研究
#
# 关键变更：使用 experiments 列表显式控制要运行的实验组合，避免一次性跑全部。
# 如果不写 experiments 字段，系统会自动回退到攻击×防御的全组合模式。

# ==================== 系统配置 ====================
system:
  num_clients: 10                    # 客户端数量 (>=3)
  num_rounds: 10                     # 联邦学习轮数
  num_epochs: 2                      # 每轮本地训练epoch数
  batch_size: 64                     # 本地训练batch大小
  learning_rate: 0.01                # 学习率
  device: "cpu"                      # 计算设备 (cpu/cuda)
  random_seed: 42                    # 随机种子
  client_sampling_rate: 0.5         # 每轮随机选择的客户端比例
  upload_difference: true            # 上传差值(true)还是完整权重(false)

# ==================== 数据集配置 ====================
data:
  dataset: "mnist"                   # 数据集: mnist, fashion_mnist, cifar10
  data_dir: "./data"                 # 数据存储目录
  num_classes: 10                    # 类别数量
  iid: true                          # 是否IID分布
  alpha: 0.5                         # Dirichlet分布参数 (非IID时使用)

# ==================== 模型配置 ====================
model:
  name: "lenet"                      # 模型: mlp, cnn, lenet, mobilenetv2
  hidden_dims: [256, 128]
  dropout: 0.2
  width_mult: 1.0
  growth_rate: 12
  block_config: [6, 6, 6]
  num_init_features: 24
  bn_size: 4
  drop_rate: 0.0

# ==================== CKKS加密配置 ====================
ckks:
  poly_modulus_degree: 4096         # 轻量快速实验推荐 4096
  coeff_mod_bit_sizes: [40, 20, 40]
  global_scale: 1048576             # 2^20
  slot_packing: true

# ==================== 实验模式配置 ====================
# 只支持加密(encrypted)模式（明文基线已移除）
experiment_modes:
  - "encrypted"

# ==================== 攻击配置库 ====================
# 以下定义所有可用的攻击场景，供 experiments 列表引用。
attacks:
  - name: "sign_flipping"
    type: "sign_flipping"
    malicious_clients:
      count: 2
      mode: "random"                # random / first
    data_attack:
      type: "label_flipping"
      flip_mode: "random"           # random / targeted / all_to_one
      poison_rate: 1.0
    model_attack_params:
      flip_rate: 1.0
      scale: 1.0

  - name: "scaling"
    type: "scaling"
    malicious_clients:
      count: 2
      mode: "random"
    model_attack_params:
      scale_factor: 10.0

  - name: "gaussian_noise"
    type: "gaussian_noise"
    malicious_clients:
      count: 2
      mode: "random"
    model_attack_params:
      std: 1.0
      mean: 0.0

  - name: "backdoor"
    type: "backdoor_model"
    malicious_clients:
      count: 2
      mode: "random"
    data_attack:
      type: "backdoor"
      target_class: 0
      poison_rate: 0.3
      trigger_size: 3
      trigger_value: 1.0
      position: "bottom_right"
    model_attack_params:
      scale_factor: 10.0

  - name: "mimic_alie"
    type: "mimic_alie"
    malicious_clients:
      count: 2
      mode: "random"
    model_attack_params:
      z: 1.5

  - name: "constant"
    type: "constant"
    malicious_clients:
      count: 2
      mode: "random"
    model_attack_params:
      constant_value: 0.0

# ==================== 防御配置库 ====================
# 以下定义所有可用的防御方法，供 experiments 列表引用。
defenses:
  - name: "fedavg"
    aggregation_rule: "fedavg"
    anomaly_filter: null
    params: {}

  - name: "median"
    aggregation_rule: "median"
    anomaly_filter: null
    params: {}

  - name: "trimmed_mean"
    aggregation_rule: "trimmed_mean"
    anomaly_filter: null
    params:
      trim_ratio: 0.2                # 两端各截断 20%

  - name: "krum"
    aggregation_rule: "krum"
    anomaly_filter: null
    params:
      f: null                        # 自动推断: (n-3)//2，对10客户端为3

  - name: "multi_krum"
    aggregation_rule: "multi_krum"
    anomaly_filter: null
    params:
      f: null
      m: null

  - name: "geometric_median"
    aggregation_rule: "geometric_median"
    anomaly_filter: null
    params:
      gm_max_iter: 10

  - name: "norm_clip_fedavg"
    aggregation_rule: "fedavg"
    anomaly_filter: "norm_clip"
    params:
      max_norm_ratio: 3.0

  - name: "cosine_fedavg"
    aggregation_rule: "fedavg"
    anomaly_filter: "cosine_similarity"
    params:
      cos_threshold: 0.5

  - name: "multi_criteria_fedavg"
    aggregation_rule: "fedavg"
    anomaly_filter: "multi_criteria"
    params:
      norm_ratio: 5.0
      cos_threshold: -0.1

# ==================== 输出配置 ====================
output:
  results_dir: "./results"
  model_dir: "./history_models"
  viz_dir: "./visualization"
  save_interval: 999
