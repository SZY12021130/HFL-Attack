# ============================================================================
# 实验：AThFHE 方案二（双服务器非共谋架构）—— USENIX Sec'25 ATASSES 扩展
# ============================================================================
# 只写与默认配置的差异：公共参数（数据集/模型/系统/带宽...）全部继承
# configs/config.yaml，此处仅开启 athfhe_twin 轨道。调参直接在本文件
# 覆盖对应键即可（如 system.num_rounds、athfhe_twin.threshold）。
#
# 运行：python main.py --config configs/config_athfhe_twin.yaml

extends: config.yaml

athfhe_twin:
  enabled: true
  parallel: true          # 块间多进程并行（每块独立确定性随机流，与串行逐位一致）
  parallel_workers: 0     # 0 = 自动 min(cpu_count, n_blocks)；≤1 或块数 <8 退回串行
  parallel_progress: false  # 并行时每 50 块打印进度
  real_coeff_bits: 218    # 等效真实 CKKS 折算系数位宽（0 = 关闭折算）
